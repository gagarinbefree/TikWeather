name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          VITE_OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
      - run: cmp shared/assets/branding/app-icon-512.png dist/app-icon-512.png
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - name: Upload browser reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Set release version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          echo "name=$base.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - run: npm run build:android
        env:
          VITE_WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          VITE_OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          VITE_APP_VERSION: ${{ steps.version.outputs.name }}
      - name: Check Android web bundle
        run: |
          test ! -e dist-android/sw.js
          test ! -e dist-android/manifest.webmanifest
          grep -q 'src="./assets/' dist-android/index.html
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./android/gradlew -p android assembleDebug --no-daemon
      - run: cmp shared/assets/branding/app-icon-512.png android/app/build/generated/shared-icon/drawable-nodpi/tikweather_icon.png
      - uses: actions/upload-artifact@v4
        with:
          name: TikWeather-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare Android signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tikweather-signing.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tikweather-signing.jks" >> "$GITHUB_ENV"
      - name: Build signed Android release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./android/gradlew -p android assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=${{ steps.version.outputs.name }}
      - name: Verify signed APK and version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "versionCode='${{ github.run_number }}' versionName='${{ steps.version.outputs.name }}'"
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TikWeather-Android.apk
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" TikWeather-Android.apk --clobber
          else
            gh release create "$tag" TikWeather-Android.apk --target "$GITHUB_SHA" --title "TikWeather $RELEASE_VERSION" --generate-notes --latest
          fi
